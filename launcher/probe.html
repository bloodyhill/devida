<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Device Probe</title>
  <style>
    html { font-size: calc(100vw / 120); }
    body {
      margin: 0; padding: 2.5rem 4rem; background: #000; color: #f5f5f7;
      font-family: Inter, "Helvetica Neue", Arial, sans-serif; overflow: hidden; height: 100vh; box-sizing: border-box;
    }
    h1 { margin: 0; font-size: 2.4rem; letter-spacing: -0.03em; }
    .sub { margin-top: 0.4rem; font-size: 1.1rem; color: rgba(245,245,247,0.65); }
    .cols { display: flex; gap: 2rem; margin-top: 1.5rem; height: calc(100vh - 12rem); }
    .col { display: flex; flex-direction: column; min-width: 0; }
    .col.api { flex: 1.5; }
    .col.side { flex: 1; gap: 1.5rem; }
    .box { display: flex; flex-direction: column; min-height: 0; flex: 1; }
    h2 { margin: 0 0 0.6rem; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(245,245,247,0.6); }
    h2 span { text-transform: none; letter-spacing: 0; color: #f5f5f7; margin-left: 0.6rem; }
    pre {
      flex: 1; margin: 0; padding: 1.1rem; border-radius: 1rem; background: #141416;
      font: 1rem/1.4 Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-all;
      overflow: hidden;
    }
    .status { margin-top: 0.8rem; font-size: 1rem; color: rgba(245,245,247,0.6); }
  </style>
</head>
<body>
  <h1>Device probe</h1>
  <div class="sub">Up / Down: scroll the API list a page at a time. Take a photo of each page. Then press Input or Settings once and come back. Back three times quickly to leave.</div>
  <div class="cols">
    <div class="col api box"><h2>TV APIs <span id="page"></span></h2><pre id="api"></pre></div>
    <div class="col side">
      <div class="box"><h2>Device</h2><pre id="device"></pre></div>
      <div class="box"><h2>Events &amp; keys</h2><pre id="events"></pre></div>
    </div>
  </div>
  <div class="status" id="status"></div>

  <script>
  (function () {
    'use strict';
    // Globals worth listing: Hisense/VIDAA/Opera/OIPF names, plus TV-ish words on
    // names that aren't standard PascalCase constructors or on* handlers.
    var VENDOR = /hisense|vidaa|^omi|opera|hbbtv|oipf|tizen|webos|smarttv/i;
    var TOPIC = /appmanager|launch|source|input|hdmi|airplay|cast|^tv|tv$/i;
    function interesting(k) {
      if (VENDOR.test(k)) return true;
      return TOPIC.test(k) && !/^[A-Z][A-Za-z0-9]*$/.test(k) && !/^on[a-z]/.test(k);
    }
    // Values that identify this TV: shown as present, never printed.
    var SENSITIVE = /mac|deviceid|serial|uuid|token|key|ip|dns|cert|account|user/i;
    var report = { probedAt: new Date().toISOString(), device: {}, api: {}, getters: {}, events: [], keys: [] };

    function safe(fn, fallback) { try { return fn(); } catch (e) { return fallback === undefined ? 'error: ' + e : fallback; } }

    function walk(obj, depth, seen) {
      // Member names, function arity and primitive values, a few levels deep.
      var out = {};
      seen = seen || [];
      if (seen.indexOf(obj) !== -1) return '[cycle]';
      seen.push(obj);
      var names = safe(function () {
        var all = Object.getOwnPropertyNames(obj);
        var proto = Object.getPrototypeOf(obj);
        if (proto && proto !== Object.prototype && proto !== Function.prototype) all = all.concat(Object.getOwnPropertyNames(proto));
        return all.filter(function (n, i) { return all.indexOf(n) === i && n !== 'constructor'; });
      }, []);
      names.forEach(function (k) {
        var v = safe(function () { return obj[k]; }, null);
        var t = typeof v;
        if (t === 'function') out[k] = 'fn(' + v.length + ')';
        else if (t === 'object' && v) out[k] = depth > 0 ? walk(v, depth - 1, seen) : '{…}';
        else out[k] = SENSITIVE.test(k) ? t + ' (hidden)' : t + ': ' + String(v).slice(0, 60);
      });
      return out;
    }

    // ---- Device ----
    var d = report.device;
    d.userAgent = navigator.userAgent;
    d.viewport = window.innerWidth + 'x' + window.innerHeight + ' @' + window.devicePixelRatio;
    d.origin = location.origin;
    d.mimeTypes = safe(function () { return Array.prototype.map.call(navigator.mimeTypes || [], function (m) { return m.type; }); }, []);

    // ---- APIs ----
    Object.getOwnPropertyNames(window).sort().forEach(function (k) {
      if (!interesting(k)) return;
      var v = safe(function () { return window[k]; }, null);
      if (typeof v === 'function') report.api[k] = 'fn(' + v.length + ')';
      else if (v && typeof v === 'object') report.api[k] = walk(v, 2);
      else report.api[k] = typeof v;
    });

    // Read-only getters (Hisense_GetX with no arguments) are safe to call.
    Object.keys(report.api).forEach(function (k) {
      if (/^Hisense_Get/i.test(k) && typeof window[k] === 'function' && window[k].length === 0) {
        var val = safe(function () { return window[k](); });
        report.getters[k] = SENSITIVE.test(k) ? (val ? '(present, hidden)' : String(val)) : val;
      }
    });

    // ---- Events ----
    function logEvent(kind, data) {
      var text = safe(function () { return typeof data === 'string' ? data : JSON.stringify(data); }, String(data));
      report.events.push({ kind: kind, data: String(text).slice(0, 400), t: Math.round(performance.now()) });
      renderSide();
      send();
    }
    if (window.omi_platform && typeof omi_platform.addPlatformEventListener === 'function') {
      var ok = safe(function () { omi_platform.addPlatformEventListener(function (e) { logEvent('platform', e); }); return 'listening'; });
      logEvent('setup', 'omi_platform.addPlatformEventListener: ' + ok);
    }
    document.addEventListener('visibilitychange', function () { logEvent('visibility', document.visibilityState); });
    window.addEventListener('blur', function () { logEvent('window', 'blur'); });
    window.addEventListener('focus', function () { logEvent('window', 'focus'); });
    window.addEventListener('message', function (e) { logEvent('message', e.data); });

    // ---- Rendering ----
    var apiEl = document.getElementById('api');
    var apiText = JSON.stringify({ getters: report.getters, api: report.api }, null, 1);

    function renderApi() {
      apiEl.textContent = apiText;
      updatePage();
    }
    function updatePage() {
      var pages = Math.max(1, Math.ceil(apiEl.scrollHeight / apiEl.clientHeight));
      var page = Math.min(pages, Math.round(apiEl.scrollTop / apiEl.clientHeight) + 1);
      document.getElementById('page').textContent = 'page ' + page + ' / ' + pages;
    }
    function renderSide() {
      document.getElementById('device').textContent = JSON.stringify(report.device, null, 1);
      var lines = report.events.slice(-8).map(function (e) { return '[' + e.kind + '] ' + e.data; })
        .concat(report.keys.slice(-8).map(function (e) { return e.type + ' ' + e.keyCode + ' ' + e.key + (e.repeat ? ' (repeat)' : ''); }));
      document.getElementById('events').textContent = lines.join('\n') || 'Waiting…';
    }

    // Send results back only when served by tools/probe_server.py over plain HTTP:
    // an HTTPS page (GitHub Pages) can't post to a LAN address.
    var canReport = location.protocol === 'http:';
    var sendTimer = null;
    function send() {
      var status = document.getElementById('status');
      if (!canReport) { status.textContent = 'On-screen only. Photograph each page of TV APIs.'; return; }
      clearTimeout(sendTimer);
      sendTimer = setTimeout(function () {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/report');
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.onload = function () {
          status.textContent = xhr.status < 300 ? 'Sent to PC at ' + new Date().toLocaleTimeString() : 'PC answered ' + xhr.status + '. Photograph the pages instead.';
        };
        xhr.onerror = function () { status.textContent = 'Could not reach the PC. Photograph the pages instead.'; };
        xhr.send(JSON.stringify(report));
      }, 400);
    }

    var backTimes = [];
    function onKey(e) {
      report.keys.push({ type: e.type, keyCode: e.keyCode, key: e.key, code: e.code, repeat: !!e.repeat, t: Math.round(performance.now()) });
      if (e.type === 'keydown') {
        if (e.keyCode === 40) apiEl.scrollTop += apiEl.clientHeight * 0.9;
        if (e.keyCode === 38) apiEl.scrollTop -= apiEl.clientHeight * 0.9;
        updatePage();
      }
      renderSide();
      send();
      e.preventDefault();
      if (e.type === 'keydown' && [8, 27, 461, 10009].indexOf(e.keyCode) !== -1 && !e.repeat) {
        var now = Date.now();
        backTimes = backTimes.filter(function (t) { return now - t < 1500; }).concat(now);
        if (backTimes.length >= 3) history.length > 1 ? history.back() : (location.href = './');
      }
    }
    document.addEventListener('keydown', onKey, true);
    document.addEventListener('keyup', onKey, true);

    renderApi();
    renderSide();
    send();
  })();
  </script>
</body>
</html>
